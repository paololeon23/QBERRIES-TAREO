# Config raíz: el sitio publicado es shell-template/
# (el Build command de la UI puede seguir llamando scripts/inject-gemini-config.mjs)

[build]
  publish = "shell-template"
  command = "node scripts/inject-gemini-config.mjs"
  functions = "shell-template/netlify/functions"

# Proxy API Pases → función que inyecta API_TOKEN
[[redirects]]
  from = "/api/permisos"
  to = "/.netlify/functions/permisos"
  status = 200
  force = true

# Proxy API Tarjeta Pallet → función que inyecta API_TOKEN
[[redirects]]
  from = "/api/tarjetas"
  to = "/.netlify/functions/tarjetas"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
