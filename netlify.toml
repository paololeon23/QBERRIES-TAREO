# Netlify — solo shell-template (QBerries Por hora / tareo)

[build]
  publish = "shell-template"
  command = "echo Publishing shell-template"
  functions = "shell-template/netlify/functions"

# Proxy API Pases → función que inyecta API_TOKEN (no exponer token ni URL en el JS)
[[redirects]]
  from = "/api/permisos"
  to = "/.netlify/functions/permisos"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
