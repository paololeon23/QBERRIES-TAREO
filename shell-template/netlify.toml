# Si el Base directory de Netlify es shell-template/

[build]
  publish = "."
  command = "echo Ready"
  functions = "netlify/functions"

# Proxy API Pases → función que inyecta API_TOKEN
[[redirects]]
  from = "/api/permisos"
  to = "/.netlify/functions/permisos"
  status = 200
  force = true

# Proxy API Tarjeta Pallet → función que inyecta API_TOKEN
[[redirects]]
  from = "/api/tarjetas"
  to = "/.netlify/functions/tarjetas"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
